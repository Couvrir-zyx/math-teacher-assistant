# GitHub Pages 配置
title: 数学教师助手
description: 高中数学教师图片识别话术生成工具
baseurl: "" # 如果部署在子目录，填写子目录名
url: "https://你的用户名.github.io" # 你的GitHub Pages地址

# 构建设置
markdown: kramdown
permalink: pretty

# 插件
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# 排除文件
exclude:
  - deploy.bat
  - math-teacher-assistant.zip
  - SHARE_INSTRUCTIONS.txt
  - DEPLOYMENT.md